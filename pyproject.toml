[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lexerat"
version = "0.2.1"
description = "A conlang lexicon parser with JSON output and optional HTML/LaTeX rendering."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Javier Castro"}]

[project.optional-dependencies]
render = ["Jinja2>=3.1"]

[project.scripts]
lexerat = "lexerat:main"

[project.urls]
Repository = "https://github.com/elementalbasis/lexerat"
Issues = "https://github.com/elementalbasis/lexerat/issues"

[tool.setuptools]
py-modules = ["lexerat"]
